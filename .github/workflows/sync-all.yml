name: Open Source Master Sync to GitLab

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *' 
  workflow_dispatch: # Allows you to trigger the backup manually with 1 click

jobs:
  sync-everything:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repositories Safely to GitLab
        run: |
          # 1. 🟢 UPDATE THESE TO YOUR ACTUAL USERNAMES
          GH_USER="GoogleHub67"
          GL_USER="GoogleHub67"
          
          # 2. 🟢 LIST ALL YOUR REPO NAMES HERE (Separated by spaces)
          # You can include your chromium fork; the script will skip it automatically!
          REPOS=("chromium")

          for repo in "${REPOS[@]}"; do
            # 🛑 Automatically ignores Chromium so you don't blow past the 10GB limit
            if [[ "$repo" =~ [Cc]hromium ]]; then
              echo "⚠️ Skipping $repo (Too massive for free tier storage limits)."
              continue
            fi

            echo "-----------------------------------------------"
            echo "Syncing $repo..."
            echo "-----------------------------------------------"
            
            # Clone from GitHub safely using built-in public tokens
            git clone --mirror "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GH_USER/$repo.git"
            
            cd "$repo.git"
            
            # Push to GitLab using your hidden Personal Access Token secret
            git push --mirror "https://oauth2:${{ secrets.BACKUP_TOKEN }}@gitlab.com/$GL_USER/$repo.git"
            
            cd ..
            rm -rf "$repo.git"
          done
